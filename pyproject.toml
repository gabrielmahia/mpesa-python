[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daraja-v3"
version = "0.2.1"
description = "Production Python SDK for Safaricom M-Pesa Daraja v3"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Gabriel Mahia", email = "contact@aikungfu.dev"},
]
keywords = ["mpesa", "m-pesa", "safaricom", "daraja", "daraja-v3", "kenya", "fintech", "payments"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
]
requires-python = ">=3.10"
dependencies = []  # zero external dependencies — stdlib only
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff", "mypy", "daraja-mock>=1.0.4"]
async = ["aiohttp>=3.9"]

[project.urls]
Homepage = "https://github.com/gabrielmahia/mpesa-python"
Documentation = "https://github.com/gabrielmahia/mpesa-python/tree/main/docs"
"Bug Tracker" = "https://github.com/gabrielmahia/mpesa-python/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
